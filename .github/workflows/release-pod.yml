name: Release pod

# Pushes Samvaad.podspec to CocoaPods trunk. Runs on each version tag (e.g. 0.1.1);
# run it by hand from the Actions tab to push an existing tag.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to push (e.g. 0.1.0)
        required: true

jobs:
  trunk-push:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Check tag matches the podspec version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(grep -E "s.version *=" Samvaad.podspec | sed -E "s/.*'([^']+)'.*/\1/")
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Samvaad.podspec version $version."
            exit 1
          fi

      - name: Push to CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "::error::Missing repository secret COCOAPODS_TRUNK_TOKEN."
            exit 1
          fi
          pod trunk push Samvaad.podspec --allow-warnings
