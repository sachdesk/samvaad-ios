name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build
        run: xcodebuild -scheme Samvaad -destination 'generic/platform=iOS Simulator' build

      - name: Test
        run: xcodebuild -scheme Samvaad -destination 'platform=iOS Simulator,name=iPhone 15' test
